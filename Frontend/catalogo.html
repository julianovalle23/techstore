<!doctype html>
<!-- Catalogo publico de TechStore: no pide login -->
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechStore · Catálogo público</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="main" style="max-width:1100px;margin:auto;padding:24px;">
      <div class="page-heading">
        <div>
          <span class="eyebrow">TECHSTORE · TIENDA DE TECNOLOGÍA</span>
          <h1>Catálogo</h1>
          <p>Computadores y accesorios. Sin login: solo consulta.</p>
        </div>
        <div class="toolbar">
          <a href="index.html">Entrar como admin</a>
        </div>
      </div>
      <section class="panel">
        <div class="panel-title">
          <h3>Artículos</h3>
          <div class="toolbar">
            <select id="f-cat" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option></select>
            <input id="f-nom" aria-label="Buscar por nombre" placeholder="Buscar por nombre…">
          </div>
        </div>
        <div id="grid" class="cards"></div>
        <div id="empty" class="empty" hidden>No hay artículos con ese filtro.</div>
      </section>
      <section class="panel" id="detail" hidden>
        <div class="panel-title"><h3 id="d-nombre"></h3></div>
        <div id="d-body"></div>
      </section>
    </div>
    <script>
      // API publica: GET sin token
      const base = (localStorage.getItem('techstore.base') || 'http://localhost:8050').replace(/\/+$/, '');
      const $ = s => document.querySelector(s);
      const money = v => new Intl.NumberFormat('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(v || 0));
      async function get(url) {
        const r = await fetch(base + url);
        if (!r.ok) throw new Error('Error ' + r.status);
        return r.json();
      }
      async function init() {
        const cats = await get('/api/categorias');
        cats.filter(c => c.estado === 'activa').forEach(c => {
          const o = document.createElement('option');
          o.value = c.id; o.textContent = c.nombre;
          $('#f-cat').appendChild(o);
        });
        await cargar();
      }
      async function cargar() {
        const cat = $('#f-cat').value, nom = $('#f-nom').value.trim();
        let url = '/api/articulos?';
        if (cat) url += 'categoriaId=' + cat + '&';
        if (nom) url += 'nombre=' + encodeURIComponent(nom);
        const arts = await get(url);
        const g = $('#grid'); g.innerHTML = '';
        $('#empty').hidden = arts.length > 0;
        arts.forEach(a => {
          const d = document.createElement('div');
          d.className = 'card';
          d.innerHTML = `<span class="card-icon">💻</span><div><h3>${a.nombre}</h3>
            <p>${a.marca || ''} ${a.modelo || ''}</p></div>
            <div class="metric">$${money(a.precioUnitario)}</div>
            <p>${a.stockActual > 0 ? '✅ Disponible (' + a.stockActual + ')' : '❌ Agotado'}</p>
            <button class="link-button" data-id="${a.id}">Ver detalle</button>`;
          g.appendChild(d);
        });
      }
      $('#grid').addEventListener('click', async e => {
        const b = e.target.closest('[data-id]');
        if (!b) return;
        const a = await get('/api/articulos/' + b.dataset.id);
        $('#detail').hidden = false;
        $('#d-nombre').textContent = a.nombre;
        $('#d-body').innerHTML = `<div class="info-row"><span>Marca / Modelo</span><b>${a.marca || '—'} / ${a.modelo || '—'}</b></div>
          <div class="info-row"><span>Categoría</span><b>${a.categoriaNombre}</b></div>
          <p>${a.especificaciones || ''}</p>
          <div class="totals"><span>Precio</span><b>$${money(a.precioUnitario)}</b></div>
          <div class="info-row"><span>Stock disponible</span><b>${a.stockActual}</b></div>`;
        window.scrollTo(0, document.body.scrollHeight);
      });
      $('#f-cat').onchange = cargar;
      $('#f-nom').oninput = () => { clearTimeout(window._t); window._t = setTimeout(cargar, 400); };
      init().catch(() => { $('#empty').hidden = false; $('#empty').textContent = 'No se pudo conectar con la API en ' + base; });
    </script>
  </body>
</html>
